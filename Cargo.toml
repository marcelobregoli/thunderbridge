[package]
name = "thunderbridge"
version = "0.1.0"
edition = "2024"
description = "A local IMAP/SMTP bridge for ProtonMail, so any standard mail client can use a Proton account."
license = "MIT"
readme = "README.md"
keywords = ["protonmail", "imap", "smtp", "email", "bridge"]
categories = ["email", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
getrandom = "0.3"
hex = "0.4.3"
imap-codec = "1.0.0"
mail-parser = "0.11.6"
open = "5.4.1"
pgp = "0.20.0"
proton-srp = "0.8.2"
rand = "0.8"
rcgen = "0.14.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
url = "2.5.8"
zeroize = "1.9.0"
